name: Build Windows plugin

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target ChannelStrip_VST3
      - name: Validate VST3 host compatibility
        shell: pwsh
        run: |
          $validatorZip = Join-Path $env:RUNNER_TEMP "pluginval_Windows.zip"
          $validatorDir = Join-Path $env:RUNNER_TEMP "pluginval"
          curl.exe --fail --location --retry 3 --silent --show-error `
            --output $validatorZip `
            "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip"
          if ($LASTEXITCODE -ne 0) { throw "Could not download pluginval (exit code $LASTEXITCODE)" }
          Expand-Archive -LiteralPath $validatorZip -DestinationPath $validatorDir -Force
          $validator = Get-ChildItem -LiteralPath $validatorDir -Filter "pluginval.exe" -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $validator) { throw "pluginval.exe was not found in the downloaded release" }
          $plugin = Get-ChildItem -LiteralPath "build\ChannelStrip_artefacts\Release\VST3" `
            -Directory -Filter "Channel Strip.vst3" -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $plugin) { throw "The built Channel Strip VST3 bundle was not found" }
          & $validator --strictness-level 5 --skip-gui-tests $plugin
          if ($LASTEXITCODE -ne 0) {
            throw "pluginval failed with exit code $LASTEXITCODE"
          }
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Package VST3 installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $appVersion = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $appVersion.StartsWith("v")) {
            $appVersion = $appVersion.Substring(1)
          }
          elseif ($env:GITHUB_REF_TYPE -ne "tag") {
            $projectFile = Get-Content CMakeLists.txt -Raw
            if ($projectFile -notmatch 'project\(ChannelStrip VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
              throw "Could not read the project version from CMakeLists.txt"
            }
            $appVersion = $Matches[1]
          }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "/DAppVersion=$appVersion" installer\ChannelStrip.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          $installer = "artifacts\ChannelStrip-${{ github.ref_name }}-Windows-Setup.exe"
          $output = "artifacts\ChannelStrip-v$appVersion-Windows-Setup.exe"
          if (-not (Test-Path $output)) { throw "Installer was not produced: $output" }
          if ($installer -ne $output) { Move-Item $output $installer -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: ChannelStrip-${{ github.ref_name }}-Windows-Installer
          path: artifacts/ChannelStrip-${{ github.ref_name }}-Windows-Setup.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/ChannelStrip-${{ github.ref_name }}-Windows-Setup.exe
