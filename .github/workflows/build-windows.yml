name: Build Windows plugin

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build VST3 and standalone app
        run: cmake --build build --config Release --target ChannelStrip_VST3 ChannelStrip_Standalone
      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $vst = Get-ChildItem build -Recurse -Directory -Filter "Channel Strip.vst3" | Select-Object -First 1
          if (-not $vst) { throw "VST3 bundle was not produced" }
          Compress-Archive -Path $vst.FullName -DestinationPath artifacts/ChannelStrip-VST3-Windows.zip -Force
          $app = Get-ChildItem build -Recurse -File -Filter "Channel Strip.exe" | Select-Object -First 1
          if (-not $app) { throw "Standalone executable was not produced" }
          Copy-Item $app.FullName artifacts/ChannelStrip-Standalone-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ChannelStrip-Windows
          path: artifacts/*
